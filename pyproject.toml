[project]
name = "vitals"
version = "0.1.0"
description = "A terminal dashboard of the machine's vital signs: CPU, GPU, memory, disks, and temperatures."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
vitals = "vitals:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# 0.13.7 is the first uv that installs CPython 3.15.2, the patch in .python-version.
required-version = ">=0.13.7"
