# CI repeats the two hook stages of .pre-commit-config.yaml and holds no check
# of its own, so a push that passed its hooks passes CI.
#
# The runner is a host, so it gets the host tools that the project needs, as a
# developer machine does: Nix for the devshell, the hook runner prek, and uv,
# which installs the Python of .python-version and the venv from uv.lock. The
# devshell holds neither prek, uv, nor a Python, and `nix develop` keeps the
# PATH of the runner, so `prek run` and `uv run` work inside it.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    env:
      # A CI checkout is detached on the main worktree, so the two guards of the
      # local branch workflow do not apply here (rk method worktrees).
      SKIP: no-commit-to-branch,rk-worktree-location
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the history, so the job needs all of it.
          fetch-depth: 0
      # With no version input, setup-uv installs the newest uv that
      # [tool.uv] required-version in pyproject.toml accepts.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The version the dev hosts run. The action caches the hook environments
      # under ~/.cache/prek itself, keyed on the configuration. The checksum is
      # the release's x86_64-unknown-linux-gnu archive, which the bundled table
      # predates (https://github.com/j178/prek-action#inputs).
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: '0.5.10'
          sha256: '5c832a9ccd0855b7c054320d8921d90165a37459d3ac175923bdf121ff1aa9b1'
      - name: pre-commit stage
        run: nix develop --command prek run --all-files --show-diff-on-failure
      - name: pre-push stage
        run: nix develop --command prek run --all-files --hook-stage pre-push
