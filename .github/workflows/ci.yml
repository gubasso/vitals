# CI repeats the two hook stages of .pre-commit-config.yaml and holds no check
# of its own, so a push that passed its hooks passes CI.
#
# The runner is a host, so it gets the host tools that the project needs, as a
# developer machine does: Nix for the devshell, the hook runner prek, the
# exobrain CLI, and uv, which installs the Python of .python-version and the
# venv from uv.lock. The devshell holds neither prek, exobrain, uv, nor a
# Python, and `nix develop` keeps the PATH of the runner, so `prek run`,
# `exobrain`, and `uv run` work inside it.
#
# Each step names its hook stage and leaves out the hooks of the group
# local-only, which CI cannot run. The configuration declares the scope of
# each hook, so no step sets SKIP. No hook carries the group ci-only, so the
# job runs no manual step: prek refuses a --group that matches no hook.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the history, so the job needs all of it.
          fetch-depth: 0
      # With no version input, setup-uv installs the newest uv that
      # [tool.uv] required-version in pyproject.toml accepts.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The version the dev hosts run. The action caches the hook environments
      # under ~/.cache/prek itself, keyed on the configuration. The checksum is
      # the release's x86_64-unknown-linux-gnu archive, which the bundled table
      # predates (https://github.com/j178/prek-action#inputs).
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: '0.5.10'
          sha256: '5c832a9ccd0855b7c054320d8921d90165a37459d3ac175923bdf121ff1aa9b1'
      # The hooks host-requirements and hook-revisions call exobrain. The tag
      # comes from the exobrain-tech entry of .pre-commit-config.yaml, so CI
      # runs the CLI of the release that the project pins, and the attestation
      # proves that the release workflow of exobrain-tech built the archive.
      - name: Install the exobrain CLI of the pinned exobrain-tech tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(yq '.repos[] | select(.repo | test("/exobrain-tech(\.git)?/?$")) | .rev' .pre-commit-config.yaml)
          asset=exobrain-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$tag" --repo gubasso/exobrain-tech --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo gubasso/exobrain-tech
          mkdir -p "$RUNNER_TEMP/exobrain"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/exobrain" --strip-components=1
          echo "$RUNNER_TEMP/exobrain" >> "$GITHUB_PATH"
      - name: pre-commit stage
        run: nix develop --command prek run --all-files --stage pre-commit --no-group local-only --show-diff-on-failure
      - name: pre-push stage
        run: nix develop --command prek run --all-files --stage pre-push --no-group local-only
